<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎬 CineGenie 🍿</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      background-color: #c4001d;
      width: 100%;
      padding: 20px;
      text-align: center;
      font-size: 2.5em;
      color: white;
      font-weight: bold;
    }

    .search-bar {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .search-bar input {
      padding: 20px;
      font-size: 1.5em;
      border-radius: 30px;
      width: 100%;
      max-width: 750px;
      border: 1px solid #ccc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      outline: none;
      background-color: #fff;
      transition: box-shadow 0.3s ease;
    }

    .search-bar input:focus {
      box-shadow: 0 0 8px #c4001d;
      border-color: #c4001d;
    }

    .search-bar button {
      margin-top: 20px;
      padding: 14px 35px;
      font-size: 1.2em;
      border-radius: 30px;
      background-color: #c4001d;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      border: none;
    }

    .search-bar button:hover {
      background-color: #e6002e;
    }

    .movies {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 40px;
    }

    .movie {
      width: 180px;
      background-color: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .movie:hover {
      transform: scale(1.05);
    }

    .movie img {
      width: 100%;
      height: 270px;
      object-fit: cover;
    }

    .movie-info {
      padding: 10px;
      text-align: center;
    }

    .movie-info .title {
      font-size: 1.1em;
      font-weight: bold;
      margin-top: 10px;
      color: #c4001d;
    }

    .movie-info .rating {
      background-color: #ffcc00;
      padding: 5px 10px;
      border-radius: 50px;
      font-size: 1em;
      margin-top: 10px;
      display: inline-block;
    }

    .movie-info .genre {
      font-size: 0.9em;
      color: #777;
    }

    footer {
      margin-top: 50px;
      padding: 10px;
      background-color: #c4001d;
      color: white;
      text-align: center;
      width: 100%;
    }

    .emoji {
      font-size: 2em;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>🎬 CineGenie 🍿</header>

  <!-- Search Section -->
  <div class="search-bar">
    <input
      type="text"
      id="movieQuery"
      placeholder="Search for movies, actors, or genres..."
      autofocus
    />
    <button onclick="searchMovies()">🔍 Search</button>
  </div>

  <!-- Movie Results Section -->
  <div id="movieResults" class="movies"></div>

  <div class="emoji">🎉 Let's find your next movie adventure! 🎬🍿</div>

  <footer>Made with ❤️ by Susheeth 😎 💻</footer>

  <script>
    async function searchMovies() {
      const query = document.getElementById("movieQuery").value.trim();

      if (!query) {
        alert("🚨 Please enter a search term.");
        return;
      }

      const response = await fetch("/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });

      const data = await response.json();

      if (data.error) {
        alert("❌ No results found. Try something else.");
        return;
      }

      displayMovies(data.movies);
    }

    function displayMovies(movies) {
      const container = document.getElementById("movieResults");
      container.innerHTML = "";

      if (movies.length === 0) {
        container.innerHTML = `<p>😕 No movies found. Try again!</p>`;
        return;
      }

      movies.forEach((movie) => {
        const card = document.createElement("div");
        card.className = "movie";

        const poster = movie.poster_path && movie.poster_path !== "N/A"
          ? movie.poster_path
          : "https://via.placeholder.com/300x450?text=No+Image";

        card.innerHTML = `
          <img src="${poster}" alt="${movie.title}" />
          <div class="movie-info">
            <span class="title">${movie.title} 🎥</span>
            <span class="rating">⭐ ${movie.rating}</span>
            <div class="genre">Genre: ${movie.genres} 🎭</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Enable Enter key search
    document.getElementById("movieQuery").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        searchMovies();
      }
    });
  </script>
</body>
</html>
